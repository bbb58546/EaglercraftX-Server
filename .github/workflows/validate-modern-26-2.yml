name: Validate Eaglercraft 26.2 setup

on:
  push:
    branches:
      - upgrade/eaglercraft-26.2
    paths:
      - "modern-26.2/**"
      - ".github/workflows/validate-modern-26-2.yml"
  pull_request:
    paths:
      - "modern-26.2/**"
      - ".github/workflows/validate-modern-26-2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Python syntax
        run: python -m py_compile modern-26.2/setup.py

      - name: Validate manifest JSON and checksums
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path("modern-26.2/manifest.json").read_text(encoding="utf-8"))
          assert manifest["minecraftVersion"] == "26.2"
          assert manifest["minimumJavaMajor"] >= 25
          for key in ("paper", "eaglerXPaper"):
              entry = manifest[key]
              assert entry["url"].startswith("https://"), f"{key}: HTTPS URL required"
              assert re.fullmatch(r"[0-9a-fA-F]{64}", entry["sha256"]), f"{key}: invalid SHA-256"
              assert entry["fileName"], f"{key}: missing fileName"
          print("Manifest is valid.")
          PY

      - name: Validate shell launcher syntax
        run: sh -n modern-26.2/start-server.sh
